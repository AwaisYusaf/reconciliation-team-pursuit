# Production stack for the reconciliation app, on the same EC2 box as the-pride-api.
#
# Deliberately does NOT define a reverse proxy. The Caddy container belonging to
# the-pride-api already owns :80 and :443 and issues Let's Encrypt certificates; a second
# proxy could not bind those ports and would fight the first. Instead this app joins that
# Caddy's network, and one site block is added to its Caddyfile — so deploying, restarting
# or rebuilding this stack never touches the other service.
#
#   app      - the Next.js server, reached by Caddy at reconciliation:3000
#   postgres - this app's own database, internal to this stack only

services:
  app:
    build: .
    image: reconciliation:latest
    # The alias Caddy reverse-proxies to. Must not be `app`, which the-pride-api's own
    # container already answers to on the shared network.
    container_name: reconciliation-app
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Uploads and generated artifacts when the local storage driver is used. Named so a
      # rebuild cannot destroy it; with S3_BUCKET set it simply stays empty.
      - reconciliation-data:/data
    expose:
      - '3000' # internal only — Caddy is the public face
    networks:
      - internal
      - proxy

  postgres:
    image: postgres:16-alpine
    container_name: reconciliation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconciliation
      POSTGRES_DB: reconciliation
      # Read from .env so the password is not committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - reconciliation-pg-data:/var/lib/postgresql/data
    # No host port published on purpose: nothing outside this stack needs to reach it, and
    # binding one risks colliding with the-pride-api's dev compose, which claims 5433.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reconciliation -d reconciliation']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    # The network the-pride-api's Caddy already runs on. `external` means compose attaches
    # to it and never creates, modifies or removes it.
    name: the-pride-api_default
    external: true

volumes:
  reconciliation-data:
  reconciliation-pg-data:
