# Production stack for the reconciliation app (Stay Funded 360), on its own EC2 box.
#
# Deliberately does NOT define a reverse proxy. nginx runs on the host, owns :80 and :443,
# terminates TLS with certbot's certificates and forwards to the app on 127.0.0.1:3000, the
# only port this stack publishes, and only on the loopback address. Until 2026-09 the app
# shared a box with the-pride-api and sat behind that project's Caddy instead; see
# docs/04-engineering/move-to-new-aws-account.md.
#
#   app      - the Next.js server, reached by nginx at 127.0.0.1:3000
#   postgres - this app's own database, internal to this stack only
#   migrate  - one-off schema migration, run by ./deploy.sh; never started by `up`

services:
  app:
    build: .
    image: reconciliation:latest
    container_name: reconciliation-app
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Uploads and generated artifacts when the local storage driver is used. Named so a
      # rebuild cannot destroy it; with S3_BUCKET set it simply stays empty.
      - reconciliation-data:/data
    ports:
      # Loopback only: nginx on this host is the public face, and nothing off the box can
      # reach the app directly, whatever the security group allows.
      - '127.0.0.1:3000:3000'
    networks:
      - internal

  # Migrations run here rather than inside the app's start command: two app containers
  # starting at once would race the migrator, and a failed migration must stop the deploy
  # rather than leave a half-migrated schema already serving traffic.
  #
  # `profiles` keeps it out of `up -d` — it only ever runs when deploy.sh names it. It has
  # no `container_name` on purpose, so a one-off `compose run` can never collide with a
  # long-lived container's fixed name. It has no `build:` either: it reuses the tag `app`
  # builds, which is what makes the migration provably the same code as the release.
  migrate:
    image: reconciliation:latest
    env_file: .env
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'db:migrate']
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: reconciliation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconciliation
      POSTGRES_DB: reconciliation
      # Read from .env so the password is not committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - reconciliation-pg-data:/var/lib/postgresql/data
    # No host port published on purpose: nothing outside this stack needs to reach it.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reconciliation -d reconciliation']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  reconciliation-data:
  reconciliation-pg-data:
